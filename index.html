<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1a3a">
<title>Capitão Átomo</title>
<link rel="icon" href="jogo/assets/art/icon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0f1a3a;--ink:#faf6ec;--soft:#c9d3ea;--gold:#f2b632;--card:#16244d}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#1f3270,var(--bg) 60%);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px 16px}
  main{width:100%;max-width:520px;text-align:center}
  .eyebrow{letter-spacing:.2em;font-size:13px;font-weight:700;color:var(--gold);margin:0 0 8px}
  h1{font-size:clamp(36px,10vw,56px);line-height:1;margin:0 0 12px}
  h1 strong{color:var(--gold)}
  p.lead{color:var(--soft);font-size:17px;line-height:1.45;margin:0 0 28px}
  a.card{display:block;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid #2c3f78;border-radius:18px;padding:20px;margin:0 0 14px;text-align:left}
  a.card:active{transform:scale(.99)}
  a.card b{display:block;font-size:20px;margin-bottom:4px}
  a.card span{color:var(--soft);font-size:15px}
  footer{color:#8fa0c8;font-size:13px;margin-top:22px}
</style>
</head>
<body>
<main>
  <p class="eyebrow">AS AVENTURAS DO</p>
  <h1>CAPITÃO <strong>ÁTOMO</strong></h1>
  <p class="lead">Pequenas perguntas, grandes descobertas.</p>
  <a class="card" href="jogo/"><b>▶ Jogar: Fuga das Certezas</b><span>Fase musical. Use o celular deitado e o som ligado.</span></a>
  <a class="card" href="tocador/"><b>♪ Universo Musical</b><span>Músicas da coleção e a abertura em português, espanhol e inglês.</span></a>
  <footer>Demonstração em desenvolvimento · Aunexa</footer>
</main>
</body>
</html>
