{id:'v1',label:'VOLUME 1 · O UNIVERSO DAS POSSIBILIDADES',title:'E se houver outro caminho?',cover:'capa01.png',src:'musica01_pt.mp3',desc:'Observar, perguntar e tentar de outro jeito. A primeira aventura de Lara e Tom.'},

const openingLangs={pt:{src:'abertura_pt.mp3',lyrics:'opening',label:'ABERTURA DA SÉRIE · PORTUGUÊS',title:'As Aventuras do Capitão Átomo',desc:'Uma pergunta abre a porta para um universo de descobertas.'},es:{src:'abertura_es.mp3',lyrics:'opening_es',label:'ABERTURA DA SÉRIE · ESPAÑOL',title:'Las Aventuras del Capitán Átomo',desc:'Una pregunta abre la puerta a un universo de descubrimientos.'},en:{src:'abertura_en.mp3',lyrics:'opening_en',label:'ABERTURA DA SÉRIE · ENGLISH',title:'The Adventures of Captain Atom',desc:'One little question opens up the door to a universe of discoveries.'}};
let openingLang='pt';
let selected=0,localURL=null;const $=id=>document.getElementById(id),audio=$('audio');audio.volume=.8;document.getElementById('effects').onchange=e=>document.body.classList.toggle('no-motion',!e.target.checked);
const clock=n=>Number.isFinite(n)?Math.floor(n/60)+':'+String(Math.floor(n%60)).padStart(2,'0'):'0:00';
function renderCards(){const parent=$('tracks');parent.replaceChildren();const opening=document.createElement('div');opening.className='opening-slot';const grid=document.createElement('div');grid.className='volume-grid';parent.append(opening,grid);data.forEach((t,i)=>{const b=document.createElement('button');b.className='track'+(i===0?' opening-card':'');b.setAttribute('aria-pressed',String(i===selected));b.setAttribute('aria-label',(i===0?'Abertura':'Volume '+i)+': '+t.title+(t.src?'':' — '+(i===1?'carregar áudio':'em produção')));const img=document.createElement('img');img.src='assets/'+t.cover;img.alt='';const name=document.createElement('strong');name.textContent=i===0?'Abertura da série':'Volume '+i;const subtitle=document.createElement('span');subtitle.className='track-title';subtitle.textContent=t.title;const badge=document.createElement('span');badge.className='badge'+(t.src?' ready':'');badge.textContent=t.src?'Pronta para ouvir':i===1?'Carregar áudio':'Em produção';b.append(img,name,subtitle,badge);b.onclick=()=>select(i);(i===0?opening:grid).append(b);});}

function select(i){audio.pause();selected=i;const t=data[i];audio.removeAttribute('src');if(t.src)audio.src=t.src.startsWith('blob:')?t.src:'assets/'+t.src;audio.load();$('hero').src='assets/'+t.cover;$('labelArt').src='assets/'+t.cover;$('hero').alt='Capa: '+(i===0?'O Universo das Possibilidades':t.desc);$('label').textContent=t.label;$('title').textContent=t.title;$('description').textContent=t.desc;$('status').textContent=t.src?'Pronta para ouvir':i===1?'Música criada · carregue o arquivo para ouvir':'Música em produção';$('play').disabled=!t.src;$('seek').disabled=!t.src;$('play').textContent='▶ Ouvir';$('seek').value=0;$('current').textContent='0:00';$('duration').textContent='0:00';$('prev').disabled=i===0;$('next').disabled=i===data.length-1;renderCards();renderLang();}
async function toggle(){if(!data[selected].src)return;if(audio.paused){try{await audio.play();}catch(e){$('status').textContent='Não foi possível tocar. Confira o arquivo de áudio e tente novamente.';}}else audio.pause();}
$('play').onclick=toggle;$('prev').onclick=()=>select(Math.max(0,selected-1));$('next').onclick=()=>select(Math.min(data.length-1,selected+1));audio.onplay=()=>{document.body.classList.add('is-playing');$('play').textContent='Ⅱ Pausar';$('status').textContent='Tocando agora';};audio.onpause=()=>{document.body.classList.remove('is-playing');$('play').textContent='▶ Ouvir';if(data[selected].src)$('status').textContent='Pausada';};audio.onended=()=>{document.body.classList.remove('is-playing');$('play').textContent='↻ Ouvir novamente';$('status').textContent='Faixa concluída';};audio.onloadedmetadata=()=>{$('duration').textContent=clock(audio.duration);};audio.ontimeupdate=()=>{$('current').textContent=clock(audio.currentTime);$('seek').value=audio.duration?audio.currentTime/audio.duration*100:0;};audio.onerror=()=>{document.body.classList.remove('is-playing');if(data[selected].src){$('status').textContent='Áudio indisponível. Confira os arquivos da pasta ou carregue a faixa.';$('play').textContent='▶ Tentar novamente';}};$('seek').oninput=e=>{if(Number.isFinite(audio.duration))audio.currentTime=audio.duration*Number(e.target.value)/100;};$('volume').oninput=e=>audio.volume=Number(e.target.value);
$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){$('localInfo').textContent='Use a opção de tela cheia do navegador.';}};document.onfullscreenchange=()=>$('fullscreen').textContent=document.fullscreenElement?'Sair da tela cheia':'Tela cheia';
$('load').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;if(localURL)URL.revokeObjectURL(localURL);localURL=URL.createObjectURL(f);data[1].src=localURL;data[1].lyricsDisabled=true;select(1);$('localInfo').textContent='Faixa carregada: '+f.name+'. Disponível enquanto esta página estiver aberta.';};
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!['INPUT','BUTTON'].includes(document.activeElement.tagName)){e.preventDefault();toggle();}});
const langSwitch=document.createElement('div');langSwitch.className='lang-switch';langSwitch.setAttribute('role','group');langSwitch.setAttribute('aria-label','Idioma da abertura');[['pt','Português'],['es','Español'],['en','English']].forEach(([code,name])=>{const b=document.createElement('button');b.type='button';b.dataset.lang=code;b.textContent=name;b.onclick=()=>{if(openingLang===code)return;openingLang=code;Object.assign(data[0],openingLangs[code]);select(0);};langSwitch.append(b);});$('description').after(langSwitch);
function renderLang(){if(!window.__langReady)return;langSwitch.hidden=selected!==0;langSwitch.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.lang===openingLang)));}
window.__langReady=true;Object.assign(data[0],openingLangs.pt);select(0);

const visual=document.querySelector('.visual'), visualGroup=document.createElement('div');visualGroup.className='visual-group';visual.before(visualGroup);visualGroup.append(visual);
const lyricsPanel=document.createElement('section');lyricsPanel.className='lyrics-panel';lyricsPanel.setAttribute('aria-label','Letra acompanhando a música');lyricsPanel.innerHTML='<div class="lyrics-head"><span>ACOMPANHE A LETRA</span><button id="toggleLyrics" aria-pressed="true">Ocultar</button></div><div class="lyric-line" id="lyricLine" aria-live="off"></div>';visualGroup.append(lyricsPanel);
let lyricKey='',captionsVisible=true;
$('toggleLyrics').onclick=()=>{captionsVisible=!captionsVisible;lyricsPanel.classList.toggle('off',!captionsVisible);$('toggleLyrics').textContent=captionsVisible?'Ocultar':'Mostrar';$('toggleLyrics').setAttribute('aria-pressed',String(captionsVisible));};
function syncLyrics(){const lid=data[selected].lyrics||data[selected].id;const cues=data[selected].lyricsDisabled?[]:(window.CAPITAO_LEGENDAS?.[lid]||[]);const time=audio.currentTime;const idx=cues.findIndex(c=>time>=c.start&&time<=c.end+.16);const key=lid+':'+idx;const line=$('lyricLine');if(key!==lyricKey){lyricKey=key;line.replaceChildren();if(idx>=0){for(const w of cues[idx].words){const span=document.createElement('span');span.className='lyric-word';span.textContent=w.text;line.append(span);}}else{const span=document.createElement('span');span.className='lyric-wait';span.textContent=!data[selected].src?'Música em produção':time===0?'Toque em Ouvir e acompanhe a letra':time>cues[cues.length-1]?.end?'Uma descoberta de cada vez.':'♪';line.append(span);}}if(idx>=0){[...line.children].forEach((span,i)=>{const w=cues[idx].words[i];span.classList.toggle('sung',time>=w.end);span.classList.toggle('active',time>=w.start&&time<w.end);});}requestAnimationFrame(syncLyrics);}requestAnimationFrame(syncLyrics);
